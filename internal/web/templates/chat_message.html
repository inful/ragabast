<!--
    chat_message.html renders one round of a chat exchange. The
    LLM reply is pre-rendered to safe HTML by the handler
    (AnswerHTML); the markdown converter handles links, code
    blocks, and inline markdown, and the sanitizer runs there
    too. This template does NOT do any markdown rendering of
    its own.

    When the LLM retrieval returned sources, we render a
    collapsible <details> block listing each source. The
    DocbuilderURL field on each source (populated by the
    service layer when ragabast.docbuilder_base_url is
    configured) is used as the primary "direct link" entry;
    when that field is empty, we fall back to the
    document_id chip so the user can still see what was
    cited.

    The sources disclosure renders open by default so the
    citations the system worked to surface are immediately
    visible — a small "N sources" line was easy to miss
    entirely. The disclosure is placed inside the assistant's
    reply box so it visually attaches to the message it
    justifies, rather than floating between the reply and
    the input form.

    The source label comes from SearchResult.DisplayLabel,
    which prefers title → filename (basename without
    extension) → document_id. Using the helper keeps the
    fallback chain in sync with the inline-link text in
    service.InlineSourceLinks.
-->

<div hx-swap-oob="delete" id="chat-messages-placeholder"></div>

<!--
    One chat turn wraps the user question and the assistant
    reply in a single .chat-turn container so multi-turn
    sessions are easy to scan. The <hr> divider sits
    between turns, not within one — a 1px subtle line that
    gives the eye an anchor without competing with the
    message boxes. Aria: the wrapper carries no role of its
    own; the role="log" + aria-live="polite" on the parent
    #chat-messages container (in fallback_renderers.go)
    handles screen-reader announcements.
-->
<div class="content chat-turn">
    <div class="box">
        <p class="has-text-weight-semibold">You</p>
        <pre class="chat-msg">{{ .User }}</pre>
    </div>
    <div class="box">
        <p class="has-text-weight-semibold">Assistant</p>
        <div class="chat-msg content">{{ .AnswerHTML }}</div>
        {{ if .Sources }}
        <details class="mt-2" open>
            <summary>Sources ({{ len .Sources }})</summary>
            <ol class="mt-2">
                {{ range .Sources }}
                <li>
                    {{ .DisplayLabel }}
                    ({{ if .DocbuilderURL }}
                        <a href="{{ .DocbuilderURL }}" target="_blank" rel="noopener">direct link</a>
                    {{ else }}
                        <code>{{ .DocumentID }}</code>
                    {{ end }})
                    — similarity {{ printf "%.2f" .Similarity }}
                </li>
                {{ end }}
            </ol>
        </details>
        {{ end }}
    </div>
</div>
<hr class="chat-turn-divider">
