<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="container mt-4">
    <nav class="breadcrumb" aria-label="breadcrumbs">
        <ul>
            <li><a href="/">Home</a></li>
            <li class="is-active"><a href="#" aria-current="page">Search</a></li>
        </ul>
    </nav>

    <h1 class="title">Search Documents</h1>
    <p class="subtitle">Semantic search across the ingested corpus. Filters narrow the search without changing the query.</p>

    <form method="post" action="/search"
          hx-post="/search"
          hx-trigger="submit"
          hx-target="#search-results"
          hx-swap="innerHTML"
          hx-push-url="true">
        <input type="hidden" name="csrf_token" value="{{ .CsrfToken }}">
        <div class="field">
            <label class="label" for="query">Query</label>
            <div class="control">
                <input class="input" id="query" type="text" name="query"
                       placeholder="What are you looking for?" required>
            </div>
        </div>

        <div class="columns">
            <div class="column">
                <div class="field">
                    <label class="label" for="tag">Tag</label>
                    <div class="control">
                        <div class="select is-fullwidth">
                            <select id="tag" name="tag">
                                <option value="">(any)</option>
                                {{ range .Tags }}
                                <option value="{{ . }}">{{ . }}</option>
                                {{ end }}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="column">
                <div class="field">
                    <label class="label" for="category">Category</label>
                    <div class="control">
                        <div class="select is-fullwidth">
                            <select id="category" name="category">
                                <option value="">(any)</option>
                                {{ range .Categories }}
                                <option value="{{ . }}">{{ . }}</option>
                                {{ end }}
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="field">
            <label class="label" for="document_id">Document ID</label>
            <div class="control">
                <input class="input" id="document_id" type="text" name="document_id"
                       placeholder="(any document)">
            </div>
            <p class="help">Optional. Restrict the search to a single docbuilder document.</p>
        </div>

        <div class="field">
            <label class="label" for="top_k">Result count</label>
            <div class="control">
                <input class="input" id="top_k" type="number" name="top_k"
                       value="5" min="1" max="50" style="max-width: 8rem;">
            </div>
        </div>

        <div class="field is-grouped">
            <div class="control">
                <button class="button is-info" type="submit">Search</button>
            </div>
            <div class="control">
                <a href="/" class="button is-light">Back</a>
            </div>
        </div>
    </form>

    <!--
        htmx swap target. GET /search returns this div empty; POST
        /search returns the results fragment and htmx swaps it in
        via innerHTML. hx-push-url="true" on the form keeps the URL
        bar in sync so browser back navigates between searches.
    -->
    <div id="search-results"></div>
</body>
</html>
