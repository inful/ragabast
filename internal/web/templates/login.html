{{define "login.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · ragabast</title>
<link rel="stylesheet" href="{{ asset "login.css" }}">
<script src="{{ asset "chat.js" }}" defer></script>
</head>
<body>
  {{ template "header" .Header }}
  <main>
    <h1>Sign in to ragabast</h1>
    <p class="lead">Choose an identity provider to continue.</p>
    <ul class="providers">
      {{range .Providers}}
      <li>
        <a href="/auth/{{.Name}}/login{{if .Next}}?next={{.Next}}{{end}}">
          Sign in with {{.DisplayName}}
        </a>
      </li>
      {{end}}
    </ul>
    <p class="meta">Sessions are in-memory and last {{.SessionTTL}}.</p>
  </main>
</body>
</html>
{{end}}
