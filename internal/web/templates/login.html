{{define "login.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · ragabast</title>
<link rel="stylesheet" href="{{ asset "login.css" }}">
<script src="{{ asset "chat.js" }}" defer></script>
</head>
<body>
  {{ template "header" .Header }}
  <main class="max-w-md w-full p-8">
    <h1 class="m-0 mb-1 text-xl font-semibold">Sign in to ragabast</h1>
    <p class="m-0 mb-6 text-[0.9rem] text-[#8b949e]">Choose an identity provider to continue.</p>
    <ul class="m-0 mb-6 grid list-none gap-2 p-0">
      {{range .Providers}}
      <li>
        <a href="/auth/{{.Name}}/login{{if .Next}}?next={{.Next}}{{end}}"
           class="flex items-center gap-3 border border-[#30363d] bg-[#161b22] px-4 py-3 rounded-md font-medium text-[#e6edf3] no-underline transition-colors duration-150 hover:border-[#58a6ff] focus:border-[#58a6ff] focus-visible:outline-2 focus-visible:outline-[#58a6ff] focus-visible:outline-offset-2">
          Sign in with {{.DisplayName}}
        </a>
      </li>
      {{end}}
    </ul>
    <p class="m-0 mt-4 text-center text-[0.8rem] text-[#6e7681]">Sessions are in-memory and last {{.SessionTTL}}.</p>
  </main>
</body>
</html>
{{end}}
