# .goreleaser.yml — runs on every `v*` tag push via .github/workflows/release.yml.
# Locally: `goreleaser release --snapshot --clean --skip=publish --skip=docker`
# exercises the build / archive / checksum / SBOM paths without touching
# GitHub or any registry.

version: 2

project_name: ragabast

# Run `go mod tidy` before building so the release tree never ships a
# dirty go.sum / go.mod.
before:
  hooks:
    - go mod tidy

# Where the built artifacts go. ./dist is goreleaser's default; pinned here
# so the GitHub Action can rely on it.
dist: dist

# ---------------------------------------------------------------------------
# Builds: one matrix covering every supported OS/arch. ldflags injects the
# tag version into main.version, which surfaces through `ragabast --version`.
# CGO is disabled everywhere so the binary runs on distroless / scratch.
# ---------------------------------------------------------------------------
builds:
  - id: ragabast
    main: .
    binary: ragabast
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      # The value goes in quotes so ldflags handles the `=` correctly
      # when goreleaser shells out to go build.
      - -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Skip Windows/arm64 — Go supports it but no real users.
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

# ---------------------------------------------------------------------------
# Archives: single archive per build, .tar.gz on unix, .zip on Windows.
# Name template uses x86_64 / aarch64 to match the convention most
# users expect on Linux.
# ---------------------------------------------------------------------------
archives:
  - id: ragabast
    ids:
      - ragabast
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - LICENSE
      - README.md
      - config.example.yml
    format_overrides:
      - goos: windows
        formats:
          - zip

# ---------------------------------------------------------------------------
# Checksums: one checksums.txt at the release root with SHA-256 per artifact.
# ---------------------------------------------------------------------------
checksum:
  name_template: checksums.txt
  algorithm: sha256

# ---------------------------------------------------------------------------
# SBOM: disabled. We previously used syft to emit CycloneDX for
# every archive, but it required the syft binary to be on the
# runner's PATH and goreleaser doesn't fail gracefully when it
# isn't, so the v0.1.1 release run crashed at the SBOM step
# even though every binary had already built successfully.
# If/when formal SBOM compliance matters, re-enable here AND
# add a `go install github.com/anchore/syft/cmd/syft@latest`
# step to .github/workflows/release.yml before the goreleaser
# step.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Snapshot builds: when --snapshot is passed, version is bumped locally
# so two snapshots in the same day don't collide.
# ---------------------------------------------------------------------------
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# ---------------------------------------------------------------------------
# Changelog: groups commits by type, ignores chore-style noise. Reads the
# git log between the previous tag and HEAD.
# ---------------------------------------------------------------------------
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge branch"
      - "^Merge pull request"
      - "^chore\\(release\\)"
      - "^test:"
      - "^docs:"
      - "^ci:"
      - "^style:"
      - "^refactor:"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Bug fixes
      regexp: "^fix"
      order: 1
    - title: Performance
      regexp: "^perf"
      order: 2
    - title: Reverts
      regexp: "^revert"
      order: 3
    - title: Others
      order: 999
  format: "- {{ .SHA }}: {{ .Message }}"

# ---------------------------------------------------------------------------
# Release: publish a GitHub Release on tag push. Drafts were on for
# early milestones while the auto-generated notes were an unknown
# quantity; the changelog filter below strips chore/test/docs/ci noise
# and groups by type, so the auto body is reliable enough to ship.
# ---------------------------------------------------------------------------
release:
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"
  header: |
    ## ragabast v{{ .Version }}

    Released {{ .Date }}.
  footer: |
    ## Installation

    ### Binary

    Download the archive for your platform from the assets below,
    extract, and place `ragabast` on your `$PATH`.

    ### Docker

    ```bash
    docker pull ghcr.io/inful/ragabast:{{ .Version }}
    docker run --rm -p 8080:8080 ghcr.io/inful/ragabast:{{ .Version }}
    ```

    See [plans/ingestion.md](https://github.com/inful/ragabast/blob/main/plans/ingestion.md)
    for the ingestion guide.

# ---------------------------------------------------------------------------
# Docker images: dockers_v2 + buildx + the multi-stage Dockerfile above.
# The Dockerfile builds the Go binary inside Docker using TARGETARCH,
# so a single Dockerfile works for every platform goreleaser asks for.
# Tags: exact version, major.minor, and `latest` (only on the default branch).
# ---------------------------------------------------------------------------
dockers_v2:
  - id: ragabast
    dockerfile: Dockerfile
    images:
      - ghcr.io/inful/ragabast
    tags:
      - "{{ .Version }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: ragabast
      org.opencontainers.image.description: >-
        RAG/LLM Information Retrieval System with Docbuilder support.
      org.opencontainers.image.url: https://github.com/inful/ragabast
      org.opencontainers.image.source: https://github.com/inful/ragabast
      org.opencontainers.image.documentation: https://github.com/inful/ragabast/blob/main/README.md
      org.opencontainers.image.licenses: MIT
    annotations:
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.created: "{{ .Date }}"
