# Copy this file to ./config.yml (config.yml is ignored by git) and tweak as needed.
#
# ragabast uses two endpoints. Embeddings and chat are independent of each other:
# you can point embeddings at one server and chat at a different one.
#
# The default embeddings provider (empty / "openai") uses an
# OpenAI-compatible /v1/embeddings server:
#   - omlx              http://127.0.0.1:8000/v1
#   - vLLM              http://host:8000/v1
#   - LM Studio         http://localhost:1234/v1
#   - llama.cpp server  http://localhost:8080/v1
#   - llama-stack       http://localhost:8321/v1
#   - OpenAI            https://api.openai.com/v1
#   - Ollama (0.5+)     http://localhost:11434/v1
#
# Set embedding_provider: "embedding_gemma" to use the EmbeddingGemma
# /v2/embed wire shape instead. See the "embedding_gemma:" block below
# and the README "Embedding provider" section for details.
#
# Trailing /v1 in the URL is optional; the OpenAI-compat client strips it
# before appending /v1/chat/completions and /v1/embeddings.

# Selects the embeddings client. Empty / "openai" — OpenAI-compat
# /v1/embeddings (the default; see ollama: below).
# "embedding_gemma" — EmbeddingGemma /v2/embed (see embedding_gemma:).
# Env: EMBEDDING_PROVIDER.
embedding_provider: ""

ollama:
  # Embeddings server (OpenAI /v1/embeddings)
  base_url: http://127.0.0.1:8000/v1
  embedding_model: nomicai-modernbert-embed-base-bf16

  # Optional Matryoshka truncation. When > 0, every /v1/embeddings
  # request carries `dimensions: N` so a Matryoshka-capable server
  # (jina-embeddings-v5-text-small, OpenAI text-embedding-3-*) truncates
  # the returned vector. The client also checks the response length
  # and logs a one-shot DIMENSION MISMATCH warning if the server
  # ignored the request. Leave at 0 to disable truncation.
  #
  # jina-embeddings-v5 supports 32, 64, 128, 256, 512, 768, 1024.
  # text-embedding-3-small accepts any positive integer.
  embedding_dimensions: 0

  # Chat completions server (OpenAI /v1/chat/completions)
  chat_base_url: http://127.0.0.1:8000/v1
  chat_model: OmniCoder-9B-abliterated-MLX-4bit

  # Bearer token used for both servers. Leave empty for unauthenticated
  # local servers. Required for OpenAI, OpenRouter, and any other hosted
  # service. Use the per-server keys below when the chat and embeddings
  # providers require different tokens.
  api_key: ""

  # Per-server overrides for the bearer token. If set, these win over
  # `api_key` for their respective server only. Useful when chat and
  # embeddings live with different providers (e.g. OpenAI for chat, a
  # local omlx for embeddings).
  chat_api_key: ""
  embedding_api_key: ""

  # Concurrent /v1/embeddings requests in flight at once. Matches the
  # embeddings server's request parallelism — set to match the upstream
  # batch size for best throughput. Default 4. Env: OLLAMA_EMBEDDING_CONCURRENCY.
  embedding_concurrency: 4

  # Optional task-name prompts prepended to the text before embedding.
  # Useful for embedding models that take a task input — Google's
  # `embedding-gemma`, OpenAI `text-embedding-3-*`, jina v5, etc.
  # Set `embedding_doc_prompt` for chunks being indexed, `embedding_query_prompt`
  # for user queries. Leaving both empty sends no prefix, which is right
  # for `nomic-embed-text`, `mxbai-embed-large`, and most models that
  # don't take a task input. Setting both to the SAME value degrades
  # asymmetric retrieval quality by 5-15%.
  # Env: OLLAMA_EMBEDDING_DOC_PROMPT, OLLAMA_EMBEDDING_QUERY_PROMPT.
  embedding_doc_prompt: ""
  embedding_query_prompt: ""

  # RAG-friendly defaults (lower randomness tends to stick to retrieved context).
  # Pointer so OLLAMA_TEMPERATURE can be unset in the env without losing
  # the YAML default (zero-value is a valid temperature, not "absent").
  temperature: 0.2
  options:
    top_k: 40
    top_p: 0.9
    # `min_p` is intentionally NOT shipped in the defaults. It's not in
    # OpenAI's chat completions spec and vLLM rejects it with HTTP 400
    # when speculative decoding is enabled. Operators running Ollama,
    # llama.cpp, or vLLM without a draft model can opt in by uncommenting:
    # min_p: 0.05
    num_predict: 512
  timeout: 30s

# EmbeddingGemma /v2/embed provider. Only consulted when
# embedding_provider above is set to "embedding_gemma". The
# /v2/embed wire shape is non-standard — the body is
# {"texts": [...]} with no `model` or `dimensions` field, and
# the endpoint is unauthenticated by convention. The server
# picks the model itself; configure vectordb.embedding_dimension
# to match what the server returns.
#
# Set embedding_provider: "embedding_gemma" above and uncomment
# the block below to point ragabast at an EmbeddingGemma server.
# Env: EMBEDDING_GEMMA_BASE_URL, EMBEDDING_GEMMA_TIMEOUT,
#      EMBEDDING_GEMMA_DIMENSIONS, EMBEDDING_GEMMA_CONCURRENCY,
#      EMBEDDING_GEMMA_DOC_PROMPT, EMBEDDING_GEMMA_QUERY_PROMPT.
# embedding_gemma:
#   base_url: https://embedder.local.net
#   # EmbeddingDocPrompt and EmbeddingQueryPrompt are the
#   # task-name prefixes embedding-gemma expects. The
#   # recommended values below mirror Google's docs; leave
#   # both empty for non-prompted models.
#   embedding_doc_prompt: "title: none | text: "
#   embedding_query_prompt: "task: search result | query: "
#   # Expected response dimension. 0 disables the mismatch
#   # check. /v2/embed does NOT accept a `dimensions` request
#   # field — this is purely a check against what the server
#   # returns, used to log a one-shot DIMENSION MISMATCH
#   # warning if it differs.
#   embedding_dimensions: 768
#   # Parallel worker pool for the ingest path. Same semantics
#   # as ollama.embedding_concurrency — chunks are split into
#   # min(concurrency, n) equal sub-batches and embedded
#   # concurrently. Default 1 (sequential). Raise it to match
#   # the upstream server's request parallelism.
#   embedding_concurrency: 1
#   timeout: 30s

vectordb:
  persistence_dir: data/vectors
  # Optional: override the bleve keyword index path. Leave empty
  # (the default) to keep the index at <persistence_dir>/search.
  # Set this when the persistence_dir is on a remote filesystem
  # (NFS, shared mount) — bleve uses mmap for reads and does not
  # play well with network filesystems. The two stores can
  # legitimately live on different volumes.
  keyword_index_dir: ""
  collection_name: ragabast

  # MUST match the dimension of the embeddings that land in the
  # collection. If you set `embedding_dimensions` above, this must
  # be the truncated dimension, not the model's full dimension.
  # Common sizes:
  #   - nomicai-modernbert-embed-base      768
  #   - nomic-embed-text-v1.5             768
  #   - text-embedding-3-small (full)    1536
  #   - text-embedding-3-large (full)    3072
  #   - jina v5 at dimensions=256         256
  #   - bge-large-en-v1.5           1024
  #   - embedding-gemma (full)       768
  # Changing this requires deleting data/vectors/ and re-ingesting.
  embedding_dimension: 768

server:
  address: 0.0.0.0
  port: 8080

  # Public-facing origin used to build OAuth callback URLs.
  # Required when ragabast sits behind a reverse proxy
  # (Traefik / nginx / cloud L7 LB) and the bind address
  # doesn't match the public hostname the IdP sees. Leave
  # empty for single-host / localhost installs — the
  # callback URL falls back to http://<address>:<port>.
  #
  # The IdP callback URL registered with each provider
  # becomes: <public_url>/auth/<provider-name>/callback
  #
  # Env: SERVER_PUBLIC_URL. Trailing slash is trimmed.
  # public_url: https://ragabast.example.com

  enable_cors: true
  # Comma-separated list of origins allowed by CORS. Default
  # (empty) disables cross-origin browser requests. Use "*"
  # only for trusted local-only deployments; the safe default
  # for a server reachable from outside loopback is to list
  # every origin explicitly. Env: SERVER_CORS_ORIGINS.
  cors_origins: []
  # Bearer token required on every protected endpoint. Leave
  # empty for local single-user installs. Operators exposing
  # ragabast on a non-loopback interface MUST set this — empty
  # means anyone who can reach the listener can ingest, query,
  # and delete documents. Env: SERVER_AUTH_TOKEN.
  auth_token: ""

  # Multiple bearer tokens with optional labels (one per line).
  # Use this when several operators or services share one
  # ragabast instance and you want audit logs to distinguish
  # them. The `value` field carries the token; `label` is
  # optional and surfaces in the access log. Mixing the
  # singular `auth_token` and the plural `auth_tokens` is
  # undefined — pick one. Env: SERVER_AUTH_TOKENS
  # (comma-separated list of `label:value` pairs, or just
  # values when labels are unwanted).
  auth_tokens: []
  #  - label: alice
  #    value: TOKEN_FOR_ALICE
  #  - label: docbuilder
  #    value: TOKEN_FOR_DOCBUILDER
  # Per-client-IP token-bucket rate applied to the LLM-backed
  # and ingest endpoints. 0 disables the limiter (the
  # local-dev default).
  # Env: SERVER_RATE_LIMIT_PER_MINUTE.
  rate_limit_per_minute: 0
  # Maximum burst (immediate requests before the per-minute rate
  # kicks in). Default 5 — generous for browser interaction,
  # tight enough that a hostile scripted client cannot burn
  # upstream tokens. Env: SERVER_RATE_LIMIT_BURST.
  rate_limit_burst: 5
  # Per-document size cap for both the sync and async ingest
  # paths. The 10 MiB request-body limit caps the whole
  # request, but a single ingest request is one document —
  # the smaller per-document cap protects the chunker and
  # embedding model from being pinned by one giant input.
  # Env: SERVER_MAX_INGEST_DOCUMENT_BYTES.
  max_ingest_document_bytes: 1048576
  # On-disk directory for the async ingest queue (see
  # /api/ingest/async). Empty disables async ingest — the
  # endpoint returns 503 and the sync POST /api/ingest path
  # remains available. The directory is created with mode
  # 0700 at server start; each job file is 0600.
  # Env: SERVER_ASYNC_INGEST_QUEUE_DIR.
  async_ingest_queue_dir: data/jobs
  # Worker-pool concurrency for the async ingest queue.
  # 0 falls back to 1. Default 5 — matches the historical
  # IngestLimiter concurrency; raise it to match the
  # embeddings server's request parallelism.
  # Env: SERVER_ASYNC_INGEST_WORKERS.
  async_ingest_workers: 5
  # How often the background sweeper evicts finished jobs past
  # their TTL. Default 1h. Env: SERVER_ASYNC_INGEST_CLEANUP_INTERVAL.
  async_ingest_cleanup_interval: 1h
  # How long completed jobs are retained for /api/ingest/jobs/{id}
  # history. Default 168h (7 days). Env: SERVER_ASYNC_INGEST_COMPLETED_JOB_TTL.
  async_ingest_completed_job_ttl: 168h
  # How long failed jobs are retained — typically longer than
  # completed ones because operators want to see what went wrong.
  # Default 720h (30 days). Env: SERVER_ASYNC_INGEST_FAILED_JOB_TTL.
  async_ingest_failed_job_ttl: 720h
  read_timeout: 15s
  write_timeout: 15s
  # Mount the Model Context Protocol (MCP) server at /mcp
  # on the existing HTTP port. Bearer-token auth via the
  # existing server.auth_tokens applies. Off by default
  # so existing operators aren't surprised by a new
  # endpoint. When enabled, any MCP-compatible agent
  # (Claude Code, Claude Desktop, opencode, ...) can
  # register ragabast as a knowledge source. The /mcp
  # route serves the four tools listed in the README's
  # MCP section.
  # Env: SERVER_MCP_HTTP_ENABLED.
  mcp_http_enabled: false

processing:
  max_chunk_size: 2000
  min_chunk_size: 300
  chunk_overlap: 150

paths:
  data_dir: data
  # Empty uses the templates embedded into the binary
  # (see internal/web/templates.go). Set to a directory of
  # *.html files to ship a custom template set without
  # rebuilding. The Docker image does not need this set.
  templates_dir: ""

# Web-layer user authentication via OAuth 2.0 / OIDC.
# Leave `providers` empty for the historical single-user /
# bearer-token install — operators who don't add this
# block see no change in behavior. See plans/oauth.md for
# per-provider setup recipes (GitHub, GitLab, Forgejo,
# Keycloak, Authentik, Authelia, ADFS, ...).
#
# The bearer-token path (server.auth_token /
# server.auth_tokens) keeps working in parallel — adding
# OAuth here does NOT disable API-token auth. Programs and
# humans can use whichever path they prefer.
auth:
  # Maximum age of a session cookie before the in-memory
  # record is evicted. Sliding renewal: every authenticated
  # request extends the session's expiry by this TTL.
  # Default 12h. Set to 0 to disable expiry (sessions live
  # until the server restarts — the in-memory store is
  # wiped at restart regardless).
  # Env: AUTH_SESSION_TTL.
  session_ttl: 12h

  # Session-cookie name. Default "ragabast_session". Set to
  # something unique when running multiple ragabast
  # instances behind the same host so cookies don't
  # collide. Env: AUTH_COOKIE_NAME.
  cookie_name: ragabast_session

  # Identity providers. Each entry enables one sign-in
  # button on /auth/login. Listed below is one example
  # of each supported type — uncomment what you need.
  # Env: AUTH_PROVIDERS_JSON (JSON array).
  providers: []
  # GitHub.com OAuth app (callback URL:
  # https://<your-host>/auth/gh/callback):
  # - name: gh
  #   type: github
  #   client_id: ...
  #   client_secret: ...
  #   allowed_users:        # optional whitelist
  #     - alice
  #     - bob@example.com

  # GitLab.com or self-hosted (base_url defaults to
  # gitlab.com; set for self-hosted):
  # - name: gl
  #   type: gitlab
  #   client_id: ...
  #   client_secret: ...
  #   base_url: https://gitlab.example.com
  #   # scopes defaults to [read_user, profile, email].
  #   # read_user is REQUIRED — without it /api/v4/user
  #   # returns HTTP 403 regardless of token validity.
  #   # Don't drop it unless you've switched to type=oidc
  #   # with a discovery_url (the OIDC UserInfo claim flow).
  #   default_role: user

  # Forgejo / Gitea (base_url required, e.g. codeberg.org):
  # - name: codeberg
  #   type: forgejo
  #   base_url: https://codeberg.org
  #   client_id: ...
  #   client_secret: ...

  # Generic OpenID Connect (Keycloak, Authentik, Authelia,
  # Auth0, ADFS Server 2019+, Forgejo-with-OIDC).
  # discovery_url is the issuer; the handler fetches the
  # well-known configuration at startup. A bad discovery_url
  # (unreachable IdP, wrong path) prevents the server from
  # starting — that's the right signal for a misconfig.
  # - name: corp
  #   type: oidc
  #   discovery_url: https://keycloak.example.com/realms/main
  #   client_id: ragabast
  #   client_secret: ...

# Ragabast-specific presentation / linking knobs.
ragabast:
  # Base URL of the docbuilder instance that renders the
  # ingested documents. When set, every search result and
  # document info gets a synthetic `docbuilder_url` field
  # computed as `<docbuilder_base_url>/_uid/<uid>/`. The
  # `/_uid/<uid>/` form is docbuilder's stable permalink
  # alias — derived from the frontmatter UID rather than the
  # file path, so indexers, bookmarks, and external links
  # stay valid even after a doc moves on disk. The synthetic
  # URL is surfaced via the search API, the documents API,
  # the link-suggestions endpoint, the chat prompt, and the
  # web UI's search results page. Empty (the default) keeps
  # behavior unchanged — only the doc's own frontmatter
  # `urls:` surface as links.
  docbuilder_base_url: ""

  # When true, the chat-completions client logs every request
  # and response body under the [chat-debug] prefix on stderr.
  # Default false. Use this to verify the system prompt
  # actually reaches the model — see the full conversation,
  # not just the post-processed user-visible reply. Bodies
  # larger than 8 KiB are truncated with a "...[truncated]"
  # marker so the log stays scannable. The bearer token is
  # never logged.
  log_chat_requests: false

  # Bounded LRU cache for repeated searches. Every /api/search
  # and /api/hybrid call hits the cache; the cache key includes
  # the query text, limit, filters (date-range, tag, category,
  # document_id), and the embedding model. Ingest and delete
  # automatically evict entries whose filter could match the
  # affected document.
  #
  # `query_cache_size` caps the entry count (LRU eviction once
  # full). `query_cache_ttl` is the per-entry time-to-live so
  # model-output drift can't keep stale results alive forever.
  # Hit rate is visible in /api/health/full.
  # Set `query_cache_size: 0` to disable the cache entirely.
  # Env: RAGABAST_QUERY_CACHE_SIZE, RAGABAST_QUERY_CACHE_TTL.
  query_cache_size: 512
  query_cache_ttl: 5m

  # Maximum number of turns kept in the in-memory chat session
  # store. Each turn is one user message + one assistant reply
  # (so the default of 20 keeps ≈40 messages). FIFO-trimmed:
  # older turns are dropped when the cap is reached. Sessions
  # are in-memory only — restart drops them. Env:
  # RAGABAST_CHAT_SESSION_MAX_TURNS.
  chat_session_max_turns: 20
