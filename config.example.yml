# Copy this file to ./config.yml (config.yml is ignored by git) and tweak as needed.
#
# ragabast uses two OpenAI-compatible endpoints. You can point both at the
# same server (omlx, vLLM, LM Studio, llama.cpp --server, OpenAI) or run
# them separately. Embeddings and chat are independent of each other.
#
# Servers that work out of the box (any OpenAI Chat Completions + Embeddings
# server):
#   - omlx              http://127.0.0.1:8000/v1
#   - vLLM              http://host:8000/v1
#   - LM Studio         http://localhost:1234/v1
#   - llama.cpp server  http://localhost:8080/v1
#   - llama-stack       http://localhost:8321/v1
#   - OpenAI            https://api.openai.com/v1
#   - Ollama (0.5+)     http://localhost:11434/v1
#
# Trailing /v1 in the URL is optional; the client strips it before
# appending /v1/chat/completions and /v1/embeddings.

ollama:
  # Embeddings server (OpenAI /v1/embeddings)
  base_url: http://127.0.0.1:8000/v1
  embedding_model: nomicai-modernbert-embed-base-bf16

  # Chat completions server (OpenAI /v1/chat/completions)
  chat_base_url: http://127.0.0.1:8000/v1
  chat_model: OmniCoder-9B-abliterated-MLX-4bit

  # Bearer token used for both servers. Leave empty for unauthenticated
  # local servers. Required for OpenAI, OpenRouter, and any other hosted
  # service. Use the per-server keys below when the chat and embeddings
  # providers require different tokens.
  api_key: ""

  # Per-server overrides for the bearer token. If set, these win over
  # `api_key` for their respective server only. Useful when chat and
  # embeddings live with different providers (e.g. OpenAI for chat, a
  # local omlx for embeddings).
  chat_api_key: ""
  embedding_api_key: ""

  # RAG-friendly defaults (lower randomness tends to stick to retrieved context).
  temperature: 0.2
  options:
    top_k: 40
    top_p: 0.9
    min_p: 0.05
    num_predict: 512
  timeout: 30s
  keep_alive: true

vectordb:
  persistence_dir: data/vectors
  collection_name: ragabast

  # MUST match the dimension of the embedding model above.
  # nomicai-modernbert-embed-base returns 768. Other common sizes:
  #   - nomic-embed-text-v1.5       768
  #   - text-embedding-3-small      1536
  #   - text-embedding-3-large      3072
  #   - bge-large-en-v1.5           1024
  # Changing this requires deleting data/vectors/ and re-ingesting.
  embedding_dimension: 768

server:
  address: 0.0.0.0
  port: 8080
  enable_cors: true
  read_timeout: 15s
  write_timeout: 15s

processing:
  max_chunk_size: 1000
  min_chunk_size: 100
  chunk_overlap: 100
  max_concurrent_processing: 5

paths:
  data_dir: data
  documents_dir: data/documents
  temp_dir: data/temp
  templates_dir: templates
