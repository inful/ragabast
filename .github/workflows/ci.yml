# Runs govulncheck on every push and pull request so a new
# transitive CVE in any of our direct dependencies fails CI
# before it lands in a release. govulncheck is the official
# Go vulnerability scanner; it cross-references the Go
# vulnerability database against the symbols we actually
# call (vs. reporting every CVE in every transitive module).
#
# Runs on push to main and on every PR. Release is implicit
# because every tag push runs the release workflow which
# also includes the test+lint steps.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel any in-flight run for the same ref so force-pushes
# don't spawn parallel runs that race on the cache.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # Bind tightly to whatever go.mod says, so govulncheck
          # scans the same stdlib we develop against. go.mod's
          # Go directive should track the latest stable Go
          # patch; new stdlib CVEs will fail CI until the
          # patch is bumped. That's the intended behaviour —
          # the alternative is ignoring real stdlib vulns that
          # we DO call (e.g. http.Server.ListenAndServe for
          # crypto/tls, html/template.Execute for template
          # handling).
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: go test
        run: go test ./... -count=1

      - name: go vet
        run: go vet ./...

      - name: govulncheck
        # Official Go vulnerability scanner. Fails the build
        # if any direct dependency has a known CVE affecting
        # a symbol we actually call.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        # Pinned to the same major as local development
        # (`.golangci.yml version: "2"`). v2.13.x is built with
        # Go 1.26 — older v2.x releases were built with Go 1.25
        # and refused to load against a go.mod that targets 1.26
        # ("the Go language version used to build golangci-lint
        # is lower than the targeted Go version").
        # Bump deliberately when the linter version is upgraded.
        # v7 is required for golangci-lint v2.x — v6 rejects
        # v2 versions with "invalid version string 'v2.x'".
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          args: --timeout=5m
