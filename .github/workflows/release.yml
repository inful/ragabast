# Triggers on every tag push that matches v*. The first run will publish
# v0.1.0; from then on every tag cuts a release.
name: release

on:
  push:
    tags:
      - "v*"

# Cancel any in-flight run for the same tag — a force-pushed tag
# shouldn't have two competing pipelines building the same images.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Open the GitHub Release and upload assets.
  contents: write
  # Push images to ghcr.io/inful/ragabast.
  packages: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is REQUIRED for goreleaser to compute the
          # changelog between the previous tag and this one.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR uses the repo owner's namespace; auth with the workflow's
      # built-in GITHUB_TOKEN (no PAT needed for first-party packages).
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # Pin to a specific minor so a goreleaser release can't
          # surprise us with breaking config syntax changes.
          version: "2.x"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
